<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B2A6B"/>
      <stop offset="1" stop-color="#171126"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="fox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCA326"/>
      <stop offset="0.55" stop-color="#FC6D26"/>
      <stop offset="1" stop-color="#E24329"/>
    </linearGradient>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#sq)">
    <!-- menu bar strip -->
    <rect x="100" y="100" width="824" height="150" fill="url(#bar)"/>
    <rect x="100" y="249" width="824" height="3" fill="#FFFFFF" opacity="0.12"/>
    <circle cx="740" cy="175" r="16" fill="#FFFFFF" opacity="0.55"/>
    <circle cx="800" cy="175" r="16" fill="#FFFFFF" opacity="0.55"/>
    <!-- active menu bar item -->
    <rect x="610" y="135" width="80" height="80" rx="20" fill="#FFFFFF" opacity="0.28"/>
    <path transform="translate(622,147) scale(3.11)" fill="#FFFFFF" d="M3.5,1 L1,7 L1.5,11 L4,16 L9,17 L14,16 L16.5,11 L17,7 L14.5,1 L11.5,7.5 L9,6 L6.5,7.5 Z"/>
    <!-- tanuki -->
    <g transform="translate(512,600) scale(26) translate(-9,-9)">
      <path fill="url(#fox)" d="M3.5,1 L1,7 L1.5,11 L4,16 L9,17 L14,16 L16.5,11 L17,7 L14.5,1 L11.5,7.5 L9,6 L6.5,7.5 Z"/>
      <path fill="#FFFFFF" opacity="0.18" d="M3.5,1 L1,7 L6.5,7.5 Z M14.5,1 L17,7 L11.5,7.5 Z"/>
      <path fill="#000000" opacity="0.12" d="M9,6 L6.5,7.5 L4,16 L9,17 L14,16 L11.5,7.5 Z"/>
    </g>
  </g>
</svg>
